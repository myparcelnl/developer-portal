<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Checkout tab met bezorgopties widget en carrier mapping">
  <title>Checkout-tab — adres, bezorgopties en mapping</title>
  <rect width="800" height="420" fill="#ffffff"/>
  <g font-family="-apple-system, sans-serif">
    <rect x="20" y="20" width="760" height="84" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="44" font-size="14" fill="#13202f" font-weight="600">Adresvelden</text>
    <text x="32" y="66" font-size="12" fill="#5a6773">Gebruik aparte adresvelden (straat / nummer / toevoeging)</text>
    <rect x="32" y="74" width="44" height="22" rx="11" fill="#ff443d"/>
    <circle cx="62" cy="85" r="9" fill="#ffffff"/>
    <text x="88" y="90" font-size="12" fill="#5a6773">Aanbevolen aan · MyParcel Adressenwidget (BETA)</text>

    <rect x="20" y="116" width="760" height="142" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="140" font-size="14" fill="#13202f" font-weight="600">Bezorgopties</text>
    <text x="32" y="160" font-size="12" fill="#5a6773">Bezorgopties tonen · Positie in checkout · Prijs type</text>
    <text x="32" y="184" font-size="13" fill="#13202f" font-weight="600">Toegestane verzendmethoden</text>
    <rect x="32" y="192" width="220" height="26" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="44" y="210" font-size="11" fill="#13202f">PostNL Standaard → Pakket ▾</text>
    <rect x="260" y="192" width="240" height="26" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="272" y="210" font-size="11" fill="#13202f">PostNL Brievenbus → Brievenbuspakje ▾</text>
    <rect x="32" y="226" width="220" height="26" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="44" y="244" font-size="11" fill="#13202f">DHL Standaard → Pakket ▾</text>

    <rect x="20" y="270" width="760" height="130" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="294" font-size="14" fill="#13202f" font-weight="600">Afhaalpunten</text>
    <text x="32" y="314" font-size="12" fill="#5a6773">Standaard weergave: Kaart / Lijst</text>
    <rect x="32" y="326" width="90" height="26" rx="3" fill="#ff443d"/>
    <text x="77" y="344" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">Kaart</text>
    <rect x="126" y="326" width="90" height="26" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="171" y="344" font-size="11" fill="#5a6773" text-anchor="middle">Lijst</text>
    <text x="32" y="376" font-size="12" fill="#5a6773">Pakautomaten uitsluiten · Gesloten dagen · Eigen CSS</text>
  </g>
</svg>
