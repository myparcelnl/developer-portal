<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bestellingen tab van de MyParcel PrestaShop module">
  <title>Bestellingen-tab met vijf secties</title>
  <rect width="800" height="420" fill="#ffffff"/>
  <!-- Tabs row -->
  <g font-family="-apple-system, sans-serif" font-size="12">
    <rect x="20" y="16" width="90" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="65" y="34" text-anchor="middle" fill="#5a6773">Algemeen</text>
    <rect x="112" y="16" width="100" height="28" rx="4" fill="#ffffff" stroke="#ff443d"/>
    <text x="162" y="34" text-anchor="middle" fill="#ff443d" font-weight="600">Bestellingen</text>
    <rect x="214" y="16" width="70" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="249" y="34" text-anchor="middle" fill="#5a6773">Labels</text>
    <rect x="286" y="16" width="70" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="321" y="34" text-anchor="middle" fill="#5a6773">Douane</text>
    <rect x="358" y="16" width="80" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="398" y="34" text-anchor="middle" fill="#5a6773">Checkout</text>
    <rect x="440" y="16" width="96" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="488" y="34" text-anchor="middle" fill="#5a6773">Vervoerders</text>
  </g>
  <!-- Sections -->
  <g font-family="-apple-system, sans-serif">
    <rect x="20" y="60" width="760" height="60" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="84" font-size="14" fill="#13202f" font-weight="600">Algemeen</text>
    <text x="32" y="102" font-size="12" fill="#5a6773">Ordermodus · Concept zendingen · Automatisch verwerken · Deel klantinformatie</text>

    <rect x="20" y="132" width="760" height="60" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="156" font-size="14" fill="#13202f" font-weight="600">Automatisering orderstatus</text>
    <text x="32" y="174" font-size="12" fill="#5a6773">Status bij label aanmaken · scannen · bezorging · Stuur notificatie</text>

    <rect x="20" y="204" width="760" height="60" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="228" font-size="14" fill="#13202f" font-weight="600">Track &amp; Trace</text>
    <text x="32" y="246" font-size="12" fill="#5a6773">T&amp;T in e-mail · T&amp;T in klantaccount</text>

    <rect x="20" y="276" width="760" height="60" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="300" font-size="14" fill="#13202f" font-weight="600">Standaard gewichten</text>
    <text x="32" y="318" font-size="12" fill="#5a6773">Leeg-gewicht per pakkettype (pakket, klein pakket, brievenbus, digitale postzegel)</text>

    <rect x="20" y="348" width="760" height="60" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="372" font-size="14" fill="#13202f" font-weight="600">Bestelnotities</text>
    <text x="32" y="390" font-size="12" fill="#5a6773">Barcode in notitie · Barcode in notitie titel</text>
  </g>
</svg>
