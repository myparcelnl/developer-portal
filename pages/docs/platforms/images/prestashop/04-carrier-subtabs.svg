<svg viewBox="0 0 800 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carrier subtabs: PostNL actief, DHL, DPD, UPS, GLS, Trunkrs">
  <title>De carrier-subtabs met PostNL actief</title>
  <rect width="800" height="120" fill="#ffffff"/>
  <g font-family="-apple-system, sans-serif" font-size="12">
    <rect x="20" y="20" width="100" height="30" rx="4" fill="#ffffff" stroke="#ff443d"/>
    <text x="70" y="40" text-anchor="middle" fill="#ff443d" font-weight="600">PostNL</text>

    <rect x="124" y="20" width="130" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="189" y="40" text-anchor="middle" fill="#5a6773">DHL For You</text>

    <rect x="258" y="20" width="140" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="328" y="40" text-anchor="middle" fill="#5a6773">DHL Europlus</text>

    <rect x="402" y="20" width="160" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="482" y="40" text-anchor="middle" fill="#5a6773">DHL Parcel Connect</text>

    <rect x="566" y="20" width="60" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="596" y="40" text-anchor="middle" fill="#5a6773">DPD</text>

    <rect x="630" y="20" width="60" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="660" y="40" text-anchor="middle" fill="#5a6773">UPS</text>

    <rect x="694" y="20" width="60" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="724" y="40" text-anchor="middle" fill="#5a6773">GLS</text>

    <rect x="20" y="60" width="90" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="65" y="80" text-anchor="middle" fill="#5a6773">Trunkrs</text>
  </g>
  <text x="20" y="110" font-family="-apple-system, sans-serif" font-size="11" fill="#5a6773">Welke subtabs verschijnen hangt af van wat in je MyParcel-contract staat.</text>
</svg>
