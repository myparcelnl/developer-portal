<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MyParcel Options sectie op product-edit pagina">
  <title>MyParcel Options op de product-edit-pagina</title>
  <rect width="800" height="460" fill="#ffffff"/>
  <!-- Section header -->
  <rect x="20" y="20" width="760" height="40" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
  <text x="36" y="46" font-family="-apple-system, sans-serif" font-size="15" fill="#13202f" font-weight="600">MyParcel Options</text>
  <text x="762" y="46" font-family="-apple-system, sans-serif" font-size="18" fill="#5a6773" text-anchor="end">▾</text>

  <g font-family="-apple-system, sans-serif" font-size="12">
    <!-- Dropoff-delay -->
    <text x="240" y="100" text-anchor="end" fill="#13202f" font-weight="600">Dropoff-delay</text>
    <text x="240" y="115" text-anchor="end" fill="#5a6773" font-size="11">[global]</text>
    <rect x="260" y="88" width="140" height="28" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="272" y="106" fill="#13202f">4 days</text>
    <text x="388" y="106" fill="#5a6773">▾</text>
    <text x="260" y="135" fill="#5a6773" font-size="11">Aantal dagen om te pakken en aan te leveren</text>

    <!-- Age check 18+ -->
    <text x="240" y="170" text-anchor="end" fill="#13202f" font-weight="600">Age check 18+</text>
    <text x="240" y="185" text-anchor="end" fill="#5a6773" font-size="11">[global]</text>
    <rect x="260" y="158" width="140" height="28" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="272" y="176" fill="#13202f">Default</text>
    <text x="388" y="176" fill="#5a6773">▾</text>
    <text x="260" y="205" fill="#5a6773" font-size="11">Legitimatiecheck bij bezorging (alcohol/tabak)</text>

    <!-- Fit in digital stamp -->
    <text x="240" y="240" text-anchor="end" fill="#13202f" font-weight="600">Fit in digital stamp</text>
    <text x="240" y="255" text-anchor="end" fill="#5a6773" font-size="11">[global]</text>
    <rect x="260" y="230" width="44" height="22" rx="11" fill="#c8cdd4"/>
    <circle cx="274" cy="241" r="9" fill="#ffffff"/>
    <text x="314" y="246" fill="#5a6773">No</text>

    <!-- HS code -->
    <text x="240" y="290" text-anchor="end" fill="#13202f" font-weight="600">HS code</text>
    <text x="240" y="305" text-anchor="end" fill="#5a6773" font-size="11">[global]</text>
    <rect x="260" y="278" width="300" height="28" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="272" y="296" fill="#13202f" font-family="Menlo, monospace">123456</text>
    <text x="260" y="325" fill="#5a6773" font-size="11">Douanecode voor wereldwijde zendingen</text>

    <!-- Fit in mailbox -->
    <text x="240" y="360" text-anchor="end" fill="#13202f" font-weight="600">Fit in mailbox</text>
    <text x="240" y="375" text-anchor="end" fill="#5a6773" font-size="11">[global]</text>
    <rect x="260" y="348" width="80" height="28" rx="3" fill="#ffffff" stroke="#c8cdd4"/>
    <text x="272" y="366" fill="#13202f">1</text>
    <text x="260" y="395" fill="#5a6773" font-size="11">0 = auto, -1 = past niet in brievenbus</text>

    <!-- Exclude parcel lockers -->
    <text x="240" y="430" text-anchor="end" fill="#13202f" font-weight="600">Exclude parcel lockers</text>
    <rect x="260" y="418" width="44" height="22" rx="11" fill="#c8cdd4"/>
    <circle cx="274" cy="429" r="9" fill="#ffffff"/>
    <text x="314" y="434" fill="#5a6773">No</text>
  </g>
</svg>
