<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="General settings tab overzicht">
  <title>General settings tab met API, Delivery costs, Date settings, Print settings, Delivery methods</title>
  <rect width="800" height="540" fill="#ffffff"/>
  <!-- Tabs -->
  <g font-family="-apple-system, sans-serif" font-size="12">
    <rect x="20" y="16" width="108" height="28" rx="4" fill="#ffffff" stroke="#ff443d"/>
    <text x="74" y="34" text-anchor="middle" fill="#ff443d" font-weight="600">General settings</text>
    <rect x="130" y="16" width="110" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="185" y="34" text-anchor="middle" fill="#5a6773">PostNL</text>
    <rect x="242" y="16" width="110" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="297" y="34" text-anchor="middle" fill="#5a6773">DHL For You</text>
    <rect x="354" y="16" width="80" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="394" y="34" text-anchor="middle" fill="#5a6773">DPD</text>
    <rect x="436" y="16" width="80" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="476" y="34" text-anchor="middle" fill="#5a6773">UPS</text>
    <rect x="518" y="16" width="80" height="28" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="558" y="34" text-anchor="middle" fill="#5a6773">Trunkrs</text>
  </g>
  <!-- Sections -->
  <g font-family="-apple-system, sans-serif">
    <!-- API settings -->
    <rect x="20" y="60" width="740" height="72" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="84" font-size="14" fill="#13202f" font-weight="600">API settings</text>
    <text x="32" y="104" font-size="12" fill="#5a6773">API key · Import MyParcel Backoffice settings</text>
    <rect x="32" y="112" width="180" height="14" rx="2" fill="#e8ebef"/>
    <!-- Delivery costs -->
    <rect x="20" y="144" width="740" height="96" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="168" font-size="14" fill="#13202f" font-weight="600">Delivery costs</text>
    <text x="32" y="186" font-size="11" fill="#5a6773">Rule name / Price / Conditions</text>
    <rect x="32" y="194" width="300" height="14" rx="2" fill="#e8ebef"/>
    <text x="340" y="205" font-size="11" fill="#5a6773">€ 4,97</text>
    <rect x="32" y="214" width="260" height="14" rx="2" fill="#e8ebef"/>
    <text x="300" y="225" font-size="11" fill="#5a6773">€ 3,89</text>
    <!-- Date settings + Print settings -->
    <rect x="20" y="252" width="360" height="80" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="276" font-size="14" fill="#13202f" font-weight="600">Date settings</text>
    <text x="32" y="296" font-size="12" fill="#5a6773">Number of days · Drop-off delay</text>
    <rect x="32" y="304" width="120" height="16" rx="2" fill="#e8ebef"/>
    <rect x="400" y="252" width="360" height="80" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="412" y="276" font-size="14" fill="#13202f" font-weight="600">Print settings</text>
    <text x="412" y="296" font-size="12" fill="#5a6773">Mode · Paper type · Label description</text>
    <rect x="412" y="304" width="140" height="16" rx="2" fill="#e8ebef"/>
    <!-- Empty package weight -->
    <rect x="20" y="344" width="360" height="80" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="32" y="368" font-size="14" fill="#13202f" font-weight="600">Empty package weight</text>
    <text x="32" y="388" font-size="12" fill="#5a6773">Digital stamp · Mailbox · Small package · Package</text>
    <rect x="32" y="396" width="120" height="16" rx="2" fill="#e8ebef"/>
    <!-- Delivery methods -->
    <rect x="400" y="344" width="360" height="80" rx="4" fill="#fafbfc" stroke="#e8ebef"/>
    <text x="412" y="368" font-size="14" fill="#13202f" font-weight="600">Delivery methods</text>
    <text x="412" y="388" font-size="12" fill="#5a6773">Pickup view · Price shown · Exclude parcel lockers</text>
    <rect x="412" y="396" width="140" height="16" rx="2" fill="#e8ebef"/>
  </g>
  <!-- Save button -->
  <rect x="660" y="466" width="100" height="36" rx="3" fill="#ff443d"/>
  <text x="710" y="489" font-family="-apple-system, sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">Save Config</text>
</svg>
