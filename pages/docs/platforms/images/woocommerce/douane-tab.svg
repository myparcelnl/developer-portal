<svg viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Douane-tab met Inhoud pakket, HS-code en Herkomstland">
  <title>Douane-tab met Inhoud pakket, HS-code en Herkomstland</title>
  <rect width="800" height="150" fill="#ffffff"/>
  <g font-family="-apple-system, sans-serif" font-size="13" fill="#0f172a">
    <text x="32" y="40" font-weight="600">Inhoud pakket</text>
    <rect x="230" y="24" width="200" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="240" y="42">Goederen</text>
    <path d="M414 36 l8 8 l8 -8" stroke="#64748b" fill="none" stroke-width="1.5"/>

    <text x="32" y="80" font-weight="600">HS-code</text>
    <rect x="230" y="64" width="200" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="240" y="82">123456</text>

    <text x="32" y="120" font-weight="600">Herkomstland</text>
    <rect x="230" y="104" width="200" height="26" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="240" y="122">Nederland</text>
    <path d="M414 116 l8 8 l8 -8" stroke="#64748b" fill="none" stroke-width="1.5"/>
  </g>
</svg>
