<svg viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Vervoerder-tabs in Settings">
  <title>De negen tabs boven in de Settings-sectie</title>
  <rect width="800" height="140" fill="#ffffff"/>
  <g font-family="-apple-system, sans-serif" font-size="11">
    <!-- Row 1 -->
    <rect x="20" y="20" width="120" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="80" y="40" text-anchor="middle" fill="#5a6773">General settings</text>

    <rect x="144" y="20" width="120" height="30" rx="4" fill="#ffffff" stroke="#ff443d"/>
    <text x="204" y="40" text-anchor="middle" fill="#ff443d" font-weight="600">PostNL settings</text>

    <rect x="268" y="20" width="140" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="338" y="40" text-anchor="middle" fill="#5a6773">DHL For You settings</text>

    <rect x="412" y="20" width="140" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="482" y="40" text-anchor="middle" fill="#5a6773">DHL Europlus settings</text>

    <rect x="556" y="20" width="160" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="636" y="40" text-anchor="middle" fill="#5a6773">DHL Parcel Connect</text>

    <rect x="720" y="20" width="60" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="750" y="40" text-anchor="middle" fill="#5a6773">DPD</text>

    <!-- Row 2 -->
    <rect x="20" y="64" width="140" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="90" y="84" text-anchor="middle" fill="#5a6773">UPS Standard settings</text>

    <rect x="164" y="64" width="100" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="214" y="84" text-anchor="middle" fill="#5a6773">GLS settings</text>

    <rect x="268" y="64" width="120" height="30" rx="4" fill="#f4f6f8" stroke="#d6d9de"/>
    <text x="328" y="84" text-anchor="middle" fill="#5a6773">Trunkrs settings</text>
  </g>
  <text x="20" y="120" font-family="-apple-system, sans-serif" font-size="12" fill="#5a6773">Eén tab per vervoerder. De rode tab is actief — hier PostNL.</text>
</svg>
