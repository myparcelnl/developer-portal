    <line x1="0" y1="54" x2="800" y2="54" stroke="#e2e8f0"/>
    <rect x="16" y="60" width="14" height="14" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="56" y="72" fill="#2563eb">00KTG13F</text>
