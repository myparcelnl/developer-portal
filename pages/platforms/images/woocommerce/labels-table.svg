<svg viewBox="0 0 800 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Labels-tabel op de order met Track and Trace, status en acties">
  <title>Labels-tabel onder de MyParcel-box op de order-detailpagina</title>
  <rect width="800" height="100" fill="#ffffff"/>
  <g font-family="-apple-system, sans-serif" font-size="12" fill="#0f172a">
    <text x="16" y="20" font-weight="700" font-size="14">Labels</text>
    <rect x="0" y="28" width="800" height="26" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="56" y="44" font-weight="600">Track &amp; Trace</text>
    <text x="280" y="44" font-weight="600">Status</text>
